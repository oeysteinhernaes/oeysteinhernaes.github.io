<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.umami.website_id %}<script defer src="https://cloud.umami.is/script.js" data-website-id="{{ site.umami.website_id }}" data-domains="{{ site.umami.domain }}"></script>{% endif %}
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.url contains '/cv' %}aria-current="page"{% endif %}>CV</a>
      </div>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>{{ site.title }}{% if site.data.profile.email %} · <a href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a>{% endif %}</p>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
