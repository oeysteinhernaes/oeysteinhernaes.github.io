title: "Øystein M. Hernæs"
tagline: "Senior researcher, Ragnar Frisch Centre for Economic Research"
description: "Senior researcher at the Ragnar Frisch Centre for Economic Research. Research on labor, education, child welfare, pensions, health and empirical political economy."
baseurl: ""
url: "https://oeysteinhernaes.github.io"

logo: /assets/images/profile.jpg
twitter:
  username: ohernaes
  card: summary

# Feeds sameAs on the homepage's JSON-LD (Person schema, see index.md) -- these are the
# same links as _data/profile.yml's socials list; kept separately since _config.yml
# can't read _data at load time. Update both if the social links change.
social:
  links:
    - https://frischsenteret.no/person-details/?person_id=oysteimh
    - https://x.com/ohernaes
    - https://www.linkedin.com/in/%C3%B8ystein-hern%C3%A6s-a526402/
    - https://scholar.google.com/citations?user=dNIe1mYAAAAJ&hl=no&oi=ao
    - https://bsky.app/profile/oysteinhernaes.bsky.social
    - https://oeysteinmhernaes.com

# Visitor statistics in Umami Cloud: no cookies, no IP addresses stored, so no consent banner.
# The script only reports from `domain`, so local previews (jekyll serve) are never counted.
# Outgoing link clicks and opened abstracts are tagged in assets/js/main.js.
umami:
  website_id: "4c5e30ca-3eab-49e9-a14d-1403f0c87e9f"
  domain: "oeysteinhernaes.github.io"

# Google Search Console ownership check, rendered as a meta tag by jekyll-seo-tag.
webmaster_verifications:
  google: "rKrgf0cQN3wyW8eueE1YqDtK1nvYDwx37sZFRywy78U"

# Default social-share preview image (og:image / twitter:image) for every page.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg

markdown: kramdown
kramdown:
  input: GFM

# Only plugins on GitHub Pages' whitelisted list — keeps the build on GitHub's own
# zero-maintenance Jekyll pipeline (no custom Actions workflow required).
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
