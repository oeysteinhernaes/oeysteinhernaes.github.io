title: "Øystein M. Hernæs"
description: "Senior researcher at the Ragnar Frisch Centre for Economic Research. Research on labor, education, child welfare, pensions, health and empirical political economy."
baseurl: ""
url: "https://oeysteinhernaes.github.io"

logo: /assets/images/profile.jpg
twitter:
  username: ohernaes
