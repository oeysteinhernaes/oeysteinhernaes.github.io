- section: norwegian_publications
  title: "Hvem er «sliterne» i arbeidslivet? Yrkesvise forskjeller i livsinntekt, uførhet, avgangsalder og pensjon"
  year: 2024
  abstract: "Denne artikkelen undersøker hvordan livsinntekt, avgangsalder, samlet pensjon og risiko for uførhet og tidlig død henger sammen med yrke. Analysen bygger på tilnærmet komplette livsinntektshistorier for alle 51-åringer som var bosatt i Norge og i arbeid i 2003. Vi dokumenterer store og systematiske forskjeller i avgangsmønsteret fra ulike yrker. Forskjellene forklares i vesentlig grad av ulik dødelighet og ulik tilstrømning til uføretrygd. Vi finner også store forskjeller i inntektsprofiler, både når det gjelder lønn, og når det gjelder påfølgende pensjon. Yrker med tidlig forventet avgang fra arbeidslivet er forbundet med både lav yrkesinntekt og lav samlet pensjon. Artikkelen belyser fordelingsutfordringer i dagens pensjonssystem, og foreslår virkemidler for å utvikle et mer utjevnende pensjonssystem."
  authors:
    - {name: "Erik Hernæs", url: "https://frischsenteret.no/english/people-details/?person_id=erikhe"}
    - {name: "Knut Røed", url: "https://frischsenteret.no/english/people-details/?person_id=knutro"}
  venue: "Søkelys på arbeidslivet, Volume 41, Number 1, 5 February 2024"
  venue_url: "https://doi.org/10.18261/spa.41.1.4"
  open_access: true
  note: "Followed by a published exchange: a comment from Axel West Pedersen, and the authors' reply."
  links:
    - {label: "Kommentar fra Axel West Pedersen (2025)", url: "https://www.idunn.no/doi/10.18261/spa.42.1.1"}
    - {label: "Vårt svar på kommentaren (2025)", url: "https://www.idunn.no/eprint/5DCGNKB9MEMPTJMSWP4H/full"}

- section: norwegian_publications
  title: "Barn, unge og familier i barnevernet - En longitudinell registerstudie. Delprosjekt 2: Hvordan går det med barna?"
  year: 2022
  abstract: "I dette prosjektet har vi analysert registerdata som inkluderer alle barn og unge i Norge 1994-2018. Vi har studert barn med barnevernstiltak og undersøkt hvordan det går med disse barna som barn, ungdommer og unge voksne. Kjernen i prosjektet er utnyttelse av registerdata med individinformasjon fra mange ulike kilder. Rapporten begynner rent deskriptivt med å se på hvordan det går med barn som har hatt ulike tiltak sammenliknet med barn som ikke har mottatt barnevernstiltak. Her finner vi store forskjeller. Imidlertid er det slik at både barnevernstiltak generelt og type barnevernstiltak er rettet mot utvalgte målgrupper. Det nødvendiggjør sammenlikningsgrupper som er mer spissede enn befolkningen for øvrig. Dette er nødvendig både for å tolke størrelsen på sammenhengene og for å komme nærmere noe som kan tolkes som hvilken betydning barnevernstiltak har. Når vi gjør dette, finner vi for eksempel at det stort sett går like bra eller bedre med barn plassert i fosterhjem som barn som med barn som startet med tiltak i hjemmet. Gjennom studien har vi brukt ulike sammenlikningsgrupper. Dette er en videreutvikling av tidligere studier med registerdata og utfall for barn og unge med barnevernsbakgrunn. Vi har også trukket inn andre registre knyttet til helse som besøk hos fastlege og BUP og flere bakgrunnsvariabler enn tidligere for å få et så godt grunnlag som mulig for å vurdere hvordan det går med barn og unge med tiltak fra barnevernet og hvilken betydning ulike tiltak kan ha."
  authors:
    - {name: "Nina Drange", url: "https://sites.google.com/site/ninadrange/home"}
    - {name: "Simen Markussen", url: "https://frischsenteret.no/english/people-details/?person_id=simenm"}
