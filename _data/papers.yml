- section: international_publications
  title: "Performance Pay of Program Providers and Participants' Employment Outcomes: A Field Experiment with employment services in Norway"
  year: 2025
  abstract: "This study examines whether performance-based pay for private employment service providers improves employment outcomes for program participants compared to traditional hourly compensation. Finding effective ways to outsource public services to external providers has the potential to improve the quality and efficiency of these services. Using a large-scale randomized controlled trial (RCT) conducted in Norway from April 2018 to December 2021, we evaluate the impact of different payment models on the performance of private firms in delivering labor market programs. A total of 4898 unemployed individuals were randomly assigned to either a treatment group (37%), where providers received performance-based pay contingent on participants' employment outcomes, or a control group (63%), where providers were compensated on an hourly basis. Despite the substantial financial incentives involved, our findings reveal no significant differences in employment rates, earnings, or hours worked between the two groups. The results allow us to rule out effects on monthly earnings of ±€5 and employment effects of ±1 percentage points after 12 months. There were no indications of heterogeneous treatment effects across different participant groups. A cost-benefit analysis suggests a supportive case for performance pay due to lower public costs, although this estimate is subject to uncertainty."
  venue: "Labour Economics, Volume 95, August 2025"
  venue_url: "https://doi.org/10.1016/j.labeco.2025.102753"

- section: international_publications
  title: "Variation in Outcomes of Mandated Child Welfare Referrals in Norway"
  year: 2025
  abstract: "We use administrative register data from the Norwegian child welfare service (CWS) to analyse the outcomes of 252,144 CWS referrals received between 2014 and 2020. Using a Bayesian hierarchical model, we document extensive and systematic variation across time, across referral sources and across referral concerns. Defining high severity cases as cases in which the CWS seeks mandatory interventions, mandated and nonmandated reporters have similar substantiation rates, but this shared probability declines by half across our data period. The differences in substantiation rates across reporting sources persist when comparing referrals with identical referral concerns. Drawing on the extant literature, we suggest that occupational groups may have evolved diverging reporting practices as a consequence of vague official guidelines combined with a lack of systematic training in identifying relevant cues of maltreatment. We also highlight a possible tension in the Norwegian system: while the family-oriented Norwegian CWS largely opens cases based on referrals, its aim is to work preventively and voluntarily with families before issues reach the severity covered by existing reporting mandates."
  authors:
    - {name: "Ole Røgeberg", url: "https://frischsenteret.no/english/people-details/?person_id=olejr"}
    - {name: "Mette Sønderskov", url: "https://scholar.google.com/citations?user=J4acxb4AAAAJ&hl=no"}
    - {name: "Terje Ødegaard", url: "https://www.inn.no/om-hoegskolen/ansatte/terje-odegaard"}
  venue: "Child & Family Social Work, Volume 31, Issue 1, pp. 550-565"
  venue_url: "https://doi.org/10.1111/cfs.13308"
  links:
    - {label: "Preprint", url: "https://frischsenteret.no/wp-content/uploads/2025/09/Preprint-Variation-in-Outcomes-of-Mandated-Child-Welfare-Referrals-in-Norway.pdf"}

- section: international_publications
  title: "Do Criminogenic Needs Matter in Non-Secure Settings? Assessing Change in Dynamic Risk Factors During Therapeutic Residential Care and the association with Prediction and Recidivism"
  year: 2025
  abstract: "This study examined changes in dynamic risk factors during non-secure therapeutic residential care (TRC) and their association with recidivism among 313 at-risk adolescents in Norway. Risk was assessed using the Youth Level of Service/Case Management Inventory (YLS/CMI) at intake and post-treatment, and recidivism was tracked over a 1-year period after TRC. Significant reductions in YLS/CMI risk scores were observed during treatment, and both post-treatment and change scores were significant predictors of future justice system involvement. Overall, reductions in most dynamic domains were linked to lower odds of recidivism. These findings emphasize the importance of reassessing risk factors to monitor progress, enhance recidivism prediction, inform follow-up services, and highlight the value of addressing criminogenic needs during residential treatment."
  authors:
    - {name: "Harald Kanestrøm"}
    - {name: "Jannike Kaasbøll", url: "https://www.ntnu.edu/employees/jannike.kaasboll"}
    - {name: "Marianne Stallvik", url: "https://www.ntnu.edu/employees/marianne.stallvik"}
