- section: international_publications
  title: "No Payoff from Time Off? Mandated Paid Vacation and Late-Career Employment"
  year: 2026
  abstract: "This study examines the effect of an additional week of paid vacation on labor market attachment among Norwegian workers at age 60. Employing a triple-differences estimation strategy, we exploit age-based eligibility thresholds before and after a 2009 reform to identify causal effects. Our findings indicate that the extra leave has negligible effects on both employment, sickness absence and disability benefit receipt in the year workers first receive it. If anything, some workers use the additional vacation time to increase earnings from secondary employers. The results imply that policymakers should consider alternative measures to mandated leave to support an aging workforce."
  authors:
    - {name: "Simon Bensnes", url: "https://sites.google.com/site/simonsoebstadbensnes/home"}
    - {name: "Max-Emil M. King", url: "https://www.maxemilking.com/"}
  venue: "Journal of Economic Behavior and Organization"
  venue_url: "https://doi.org/10.1016/j.jebo.2026.107526"
