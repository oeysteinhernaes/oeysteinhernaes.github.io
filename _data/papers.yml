    - {label: "Presentasjon for Bufdir 2023-05-12", url: "https://www.dropbox.com/s/cmn8vlkhbvxqxxb/2023-05-12%20Bufdir.pptx?dl=0"}

- section: norwegian_publications
  title: "Barn, unge og familier i barnevernet - En longitudinell registerstudie. Delprosjekt 1: Beskrivende analyser – barn og familier i barnevernet"
  year: 2021
  abstract: "I denne rapporten presenterer vi beskrivende analyser av longitudinelle registerdata om barnevernets tiltak og kjennetegn ved familien som mottar disse tiltakene. Hensikten med studien er å utvikle et bredt kunnskapsgrunnlag for bruk i arbeidet med å videreutvikle kvaliteten i barnevernet. Ved å muliggjøre forskning på barnevernet utfra enkeltindividers historier opp til voksen alder, gir norske registerdata en sjelden anledning til å beskrive hvem som kommer i kontakt med barnevernet og hva som kjennetegner livssituasjonen deres, og hva de møter av kompetanse og ressurser i barneverntjenesten. I alle faser av barnevernets arbeid ser vi at mange barn og unge lever i familier med færre ressurser enn vanlig, både i form av økonomi og foreldreutdanning. Mange familier lever under fattigdomsgrensen. Dårlig økonomi kan bidra til belastninger på mange områder og kan ha konsekvenser for deres muligheter for å følge opp barna. Kunnskap om sosioøkonomiske mønstre er viktig kunnskap som bakgrunn for barnevernets kartlegging og oppfølging av familiene, og det understreker behovet for et godt samarbeid mellom ulike tjenester."
  authors:
    - {name: "Nina Drange", url: "https://sites.google.com/site/ninadrange/home"}
