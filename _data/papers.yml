- section: norwegian_publications
  title: "Kun etter behov? Mottak av pleie- og omsorgstjenester og sammenheng med sosioøkonomisk status"
  year: 2022
  abstract: "Mottak av pleie- og omsorgstjenester skal prinsipielt styres av behov alene og ikke sosioøkonomisk posisjon. I denne studien bruker vi registerdata (Gerica, Norsk pasientregister, KUHR og inntekts- og populasjonsregistre fra SSB) til å undersøke sammenhengen mellom sosioøkonomisk status og mottak av pleie- og omsorgstjenester for personer mellom 70 og 90 år som var bosatt i Oslo i perioden 2007–2017 (N = 94 447). Vi finner en klar sosial gradient når det gjelder dødelighet og bruk av helsetjenester ved at personer med lavere livsinntekt har høyere dødelighet og høyere bruk av helsetjenester. Dette indikerer ulikheter i behov knyttet til sosioøkonomisk posisjon. Vi bruker tidligere mottak av helsetjenester i primær- og spesialisthelsetjenesten til å justere for behov for tjenester. Artikkelen måler statistiske sammenhenger eller korrelasjoner, ikke nødvendigvis årsaksbestemte sammenhenger."
  authors:
    - {name: "Simen Markussen", url: "https://frischsenteret.no/english/people-details/?person_id=simenm"}
    - {name: "Snorre Kverndokk", url: "https://scholar.google.com/citations?user=fPzDLGYAAAAJ&hl=en"}
    - {name: "Henning Øien", url: "https://www.fhi.no/en/ab/departments-and-centres/health-services-research/henning-oien/"}
  venue: "Tidsskrift for omsorgsforskning, 02/2022 (Volum 8)"
  links:
    - {label: "Preprint", url: "https://frischsenteret.no/wp-content/uploads/2025/07/tfo.8.1.13.pdf"}

- section: norwegian_publications
  title: "Økende inntektssegregering i norske byregioner"
  year: 2020
  abstract: "Vi studerer endringer i bosettingsmønsteret i norske nabolag de siste 25 årene (1993–2017), med basis i en indikator som beskriver den gjennomsnittlige forskjellen i inntektsrang mellom voksne innen nabolag (grunnkretser). Inntektsrang er beregnet nasjonalt eller innenfor pendlerregioner, og separat etter alder og kjønn for alle mellom 30 og 60 år. Begrepet «segregering» beskriver da en tendens til at personer med lignende inntektsrang i den regionale inntektsfordelingen bosetter seg i samme nabolag. Vi finner tegn på at inntektssegregeringen har økt i Norge etter årtusenskiftet, og at denne utviklingen har vært sterkest i Osloregionen og i byene rundt Oslofjorden. Ved å sammenholde utviklingen i ulike arbeidsmarkedsregioner viser vi at innvandring samvarierer sterkt med den økte segregeringen."
  authors:
    - {name: "Simen Markussen", url: "https://frischsenteret.no/english/people-details/?person_id=simenm"}
    - {name: "Knut Røed", url: "https://frischsenteret.no/english/people-details/?person_id=knutro"}
  venue: "Tidsskrift for boligforskning, 02/2020 (Volum 3)"
  venue_url: "https://doi.org/10.18261/issn.2535-5988-2020-02-02"
  open_access: true

- section: norwegian_publications
  title: "Hvordan påvirker økt bruk av vilkår for sosialhjelp sysselsetting og lønnsfordeling?"
  year: 2018
  abstract: "Artikkelen evaluerer virkninger av vilkår knyttet til arbeid eller annen aktivitet til unge sosialhjelpsmottakere. Artikkelen utnytter variasjon i praksis innen sosialkontor som kommer fra økt bruk av vilkår fra forskjellig tidspunkt i forskjellige kommuner på 1990- og 2000-tallet. Hovedresultatene er at praksisendringen reduserte andelen som mottar sosialhjelp med rundt et halvt prosentpoeng, økte sysselsettingsraten med rundt ett prosentpoeng, og hadde positive virkninger i den nedre delen av lønnsfordelingen og ingen virkninger i den øvre delen. Virkningen på samlet inntekt er også positiv, noe som betyr at økningen i lønnsinntekt mer enn kompenserte for nedgangen i sosialhjelpsutbetalinger som etterfulgte praksisendringen."
  venue: "Søkelys på arbeidslivet, Vol 35(1/2), 4-22"
  venue_url: "https://www.idunn.no/spa/2018/01-02/hvordan_paavirker_oekt_bruk_av_vilkaar_for_sosialhjelp_syssels"
  open_access: true

- section: norwegian_publications
  title: "Kompensasjonsgrader i inntektssikringssystemet for personer med svak tilknytning til arbeidsmarkedet"
  year: 2016
  abstract: "En femdel av den potensielle arbeidsstyrken i Norge er utenfor arbeidslivet. I Del I gjør vi beregninger av hva disse personene ville ha hatt i inntekt dersom de hadde vært i fulltidsjobb. Et sentralt resultat er at det er store netto inntektsgevinster forbundet med å ha fulltidsjobb framfor trygd, i gjennomsnitt rundt 100 000 kr per år. De største inntektsgevinstene finner vi hos dem som har sosialhjelp eller overgangsstønad som sin hovedinntektskilde, siden disse mottar relativt lite i ytelser. Disse gruppene får dermed også relativt lave estimerte kompensasjonsgrader (inntekt ved trygd dividert på anslått inntekt ved fulltidsarbeid) – rundt 50-60 prosent. Blant trygdede estimerer vi at en liten gruppe, opp til 5 % av utvalget, kan stå ovenfor en kompensasjonsgrad på over 100 %. Kvinner er sterkt overrepresentert i denne gruppa. Del II støtter det dominerende bildet fra Del I som sier at inntektsgevinstene ved arbeid framfor trygd er betydelige, og viser at på grunn av tapt lønnsvekst vil gevinsten ved arbeid bare bli større og større på sikt, og kompensasjonsgraden lavere. Imidlertid vil dette aspektet i liten grad bli tatt hensyn til av en kortsiktig beslutningstaker, siden inntektssiktingssystemet er svært generøst på kort sikt (sykelønn på 100 prosent)."
  authors:
    - {name: "Simen Markussen", url: "https://frischsenteret.no/english/people-details/?person_id=simenm"}
    - {name: "Knut Røed", url: "https://frischsenteret.no/english/people-details/?person_id=knutro"}
  venue: "Frischrapport 1 (2016)"
  links:
    - {label: "Rapport 1/2016", url: "https://frischsenteret.no/wp-content/uploads/2025/07/rapp16_01.pdf"}

