- section: norwegian_publications
  title: "Risikokartlegging, målgruppe og senere utfall for ungdommer kartlagt for opphold i behandlingsinstitusjon 2013-2023"
  year: 2024
  abstract: "Denne rapporten analyserer utviklingen i risikoskårer og målgruppevurderinger for ungdom kartlagt med verktøyet Youth Level of Service/Case Management Inventory (YLS/CMI) ved inntak til barnevernsinstitusjon i perioden 2013–2023. Fokus er på ungdom vurdert for behandlingsinstitusjon på grunnlag av alvorlige atferdsvansker og/eller rusproblematikk. Rapporten undersøker utvikling i risikoskårer over tid, sammenhenger mellom YLS/CMI-skår, anbefalt målgruppe og senere utfall, samt mulige effekter av institusjonsplassering for ungdommer i målgruppen «Behandling høy». Analysen bygger på kartleggingsdata fra Bufetat koblet med omfattende registerdata fra Statistisk sentralbyrå. Resultatene viser at YLS/CMI-skår predikerer senere kriminalitet, også etter justering for demografiske og sosioøkonomiske faktorer. Rapporten finner videre at det skjer en gjennomsnittlig nedgang i risikoskår fra pre- til postkartlegging, særlig for ungdom i lavrisikogruppen. Gjennom et regresjonsdiskontinuitetsdesign undersøkes effekten av å få skår over 23. Resultatene er usikre, men kan tyde på at plassering i institusjon for målgruppen «Behandling høy» kan ha en preventiv effekt på framtidig kriminalitet."
  venue: "Frischrapport 1/2024"
  venue_url: "https://frischsenteret.no/publication-details/?skrift_id=1706"
  links:
