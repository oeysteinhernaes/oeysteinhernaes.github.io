- section: norwegian_publications
  title: "Yrkeskarrierer og relasjonelle belastninger"
  year: 2026
  abstract: "Artikkelen beskriver sammenhenger mellom yrkers grad av relasjonell eksponering og variasjoner i yrkesforløp, sykepengemottak og helserelaterte trygdeytelser. Analysen bygger på registerdata for to fødselskull fulgt over 16 år (2004–2019). Yrker er gruppert etter antatt omfang og karakter av kontakt med brukere: Dybde-yrker med emosjonelt krevende kontakt, Overflate-yrker med hyppig, men mer overflatisk kontakt, og Rest-yrker hvor slik kontakt ikke er fremtredende. Resultatene viser systematiske forskjeller mellom gruppene. Yrker med høy grad av relasjonell eksponering har gjennomgående høyere sykepengemottak og større andel mottakere av helserelaterte trygdeytelser enn øvrige yrker, også etter kontroll for kjønn, utdanning og inntekt. Forskjellene i mottak av sykepenger og helserelaterte trygdeytelser mellom yrkesgruppene er stabile eller voksende over alder. Stabiliteten i yrker og inntektsutviklingen over tid varierer mellom gruppene. Fra perioden 2004-2009 til 2014-2019, har mottak av både sykepenger og helserelaterte trygdeytelser gått ned både i Rest-yrkene og i Overflate-yrkene, mens sykepengemottaket har vært stabilt og mottak av helserelaterte trygdeytelser har gått opp i Dybde-yrkene. Forskjellene mellom yrkesgruppene har i stor grad økt."
  authors:
    - {name: "Erik Hernæs", url: "https://frischsenteret.no/english/people-details/?person_id=erikhe"}
  venue: "Frisch Rapport 1/2026"
