    - {name: "Norbert Skokauskas", url: "https://www.ntnu.edu/employees/norbert.skokauskas"}
  venue: "Crime and Delinquency, Volume 71, Issue 13-14"
  venue_url: "https://doi.org/10.1177/00111287251330776"
  open_access: true

- section: international_publications
  title: "Demand-Side Management in Fully Electrified Homes"
  year: 2025
  abstract: "We report the results of a critical peak pricing (CPP) experiment conducted in an environment where homes are fully electrified, including both room and water heating. When a CPP with day-ahead SMS announcements is applied to the afternoon peak, creating a 10-fold increase in the electricity price, electricity consumption decreases by 15.3%, virtually eliminating that peak. The largest responses come from electric vehicle (EV) households. Also, unlike households without EVs who make reductions without compensating later, EV households respond to the CPP by shifting load to off-peak and next-day use. In our experiment, where higher-income households are disproportionately likely to own EVs, we find that demand reductions induced by the CPP are similar across income groups. Our results support the view that increased electrification may not only lead to a greater need for demand-side management but also enhance the flexibility in how households can and are willing to respond."
  authors:
    - {name: "Cloé Garnache", url: "https://sites.google.com/view/cloegarnache/home"}
    - {name: "Anders Gravir Imenes"}
  venue: "Journal of the Association of Environmental and Resource Economists, Volume 12, Number 2, March 2025"
  venue_url: "https://doi.org/10.1086/731607"
  note: "Received the Ralph C. d'Arge and Allen V. Kneese Award for Outstanding Publication in the Journal of the Association of Environmental and Resource Economists, 2025."
  links:
