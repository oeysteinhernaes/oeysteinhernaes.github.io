- section: international_publications
  title: "The impact of commercial television on turnout and public policy: Evidence from Norwegian Local Politics"
  year: 2018
  abstract: "We investigate the impact of commercial television on political participation and local policy outcomes. Exploiting a geographically staggered expansion of cable television after the liberalization of Norwegian broadcasting in 1981, we show that higher cable television penetration significantly reduced turnout in municipal elections. Using individual-level data, we find that cable television coverage had a negative effect on the extent to which respondents were exposed to political information through mass media. The effect is more pronounced for individuals that on average watch more cable television; namely individuals with fewer years of schooling. Consistent with an increased difference in political participation and exposure to information between more and less educated groups, we find that commercial television led to reduced public spending and increased the share spent on education. The results are evidence that commercial mass media can influence electoral politics by reducing political participation and exposure to information of its target audiences."
  authors:
    - {name: "Sebastian Ellingsen", url: "https://sebastianellingsen.github.io/"}
  venue: "Journal of Public Economics, Volume 159, March 2018, Pages 1-15"
  venue_url: "https://www.sciencedirect.com/science/article/pii/S0047272718300215"
