- section: international_publications
  title: "Going through hell – Increased work effort in the aftermath of terrorism in Norway"
  year: 2021
  abstract: "I analyze how sickness-absence behavior in Norwegian municipalities was affected by exposure to the terrorist attack in Norway in 2011. The main finding is that in municipalities from which a resident was killed in the attack, sickness absence declined by 4 percent compared with municipalities without victims. The effect is precise, stable, and persistent. The results do not seem to be driven by changing labor market composition. The effect is found also in neighboring municipalities and is larger for people close to the age of the victims."
  venue: "Scandinavian Journal of Economics, Volume 123, Issue 1, Jan 2021"
  venue_url: "https://doi.org/10.1111/sjoe.12404"
