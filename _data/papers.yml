- section: working_papers
  title: "Has AI Widened Employment Gaps? Tracking Early-Career Employment by Occupational Exposure in Norway"
  year: 2026
  abstract: "This paper uses data on the universe of private-sector employment in Norway up to February 2026 to examine whether AI exposure has contributed to a widening employment gap across occupations with varying AI exposure. Since October 2022, the month before ChatGPT's release, employment in the most exposed occupations has grown by 0.1 percent, against 0.3 percent in the least exposed occupations. We track this number on a monthly basis on the public dashboard kiindeksen.no. The dashboard updates the full-distribution comparison each month as new administrative data arrives, allowing differential employment growth by AI exposure to be tracked over time. We also show that when we compare young workers by complete occupation quintiles of exposure, the relative decline of the most exposed quintile is estimated as an imprecise zero."
  authors:
    - {name: "Andreas R. Kostøl", url: "https://andreaskostol.no/"}
  links:
