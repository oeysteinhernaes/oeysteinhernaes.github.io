- section: international_publications
  title: "Foster Care or In-Home Support: Differences in Mental Health Treatment, Education and Crime"
  abstract: "This study traces the trajectories of children before and after their first involvement with Child Welfare Services (CWS), comparing outcomes for those placed in foster care with those who received home-based services. Leveraging administrative data covering more than two decades, we follow these children from infancy through childhood and into adulthood, tracking outcomes in health, education, crime, welfare dependence, and labor market participation. We follow children around the time of their initial CWS contact. We show that children placed in foster care are substantially more likely to receive mental health treatment in the years following the first intervention, with the increase substantially larger for girls than for boys. In contrast, we observe only modest later differences between the two groups across other outcomes. Using geographical variation in the likelihood of being assigned to foster care, we corroborate the finding that foster care placement increases mental healthcare use. One interpretation of this pattern is that foster care placement compensates for childhood adversity by improving access to mental health care services."
  authors:
    - {name: "Nina Drange", url: "https://sites.google.com/site/ninadrange/home"}
    - {name: "Simen Markussen", url: "https://frischsenteret.no/english/people-details/?person_id=simenm"}
    - {name: "Oddbjørn Raaum", url: "https://frischsenteret.no/english/people-details/?person_id=oraaum"}
  venue: "Health Economics, forthcoming"

- section: international_publications
  title: "The Sources of Researcher Variation in Economics"
  abstract: "We use a rigorous three-stage many-analysts design to assess how different researcher decisions—specifically data cleaning, research design, and the interpretation of a policy question—affect the variation in estimated treatment effects. A total of 146 research teams each completed the same causal inference task three times each: first with few constraints, then using a shared research design, and finally with pre-cleaned data in addition to a specified design. We find that even when analyzing the same data, teams reach different conclusions. In the first stage, the interquartile range (IQR) of the reported policy effect was 3.1 percentage points, with substantial outliers. Surprisingly, the second stage, which restricted research design choices, exhibited slightly higher IQR (4.0 percentage points), largely attributable to imperfect adherence to the prescribed protocol. By contrast, the final stage, featuring standardized data cleaning, narrowed variation in estimated effects, achieving an IQR of 2.4 percentage points."
  authors:
    - {name: "Nick Huntington-Klein", url: "https://nickchk.com/"}
    - {name: "Claus C. Pörtner", url: "https://clausportner.com/"}
    - {name: "Sebastian Gallegos", url: "https://www.iza.org/people/fellows/34810/sebastian-gallegos"}
    - {name: "146 others"}
  venue: "Journal of Economic Literature, forthcoming"
  links:
    - {label: "NBER wp", url: "https://www.nber.org/papers/w33729"}
    - {label: "I4R dp", url: "https://www.econstor.eu/handle/10419/312260"}
    - {label: "IZA dp", url: "https://www.iza.org/de/publications/dp/17744"}

- section: international_publications
  title: "Investigating the analytical robustness of the social and behavioural sciences"
  year: 2026
  abstract: "The same dataset can be analysed in different justifiable ways to answer the same research question, potentially challenging the robustness of empirical science. In this crowd initiative, we investigated the degree to which research findings in the social and behavioural sciences are contingent on analysts' choices. We examined a stratified random sample of 100 studies published between 2009 and 2018, in which, for one claim per study, at least five reanalysts independently reanalysed the original data. The statistical appropriateness of the reanalyses was assessed in peer evaluations, and the robustness indicators were inspected along a range of research characteristics and study designs. We found that 34% of the independent reanalyses yielded the same result (within a tolerance region of ±0.05 Cohen's d) as the original report; with a four times broader tolerance region, this indicator increased to 57%. Of the reanalyses conducted, 74% reached the same conclusion as the original investigation, 24% yielded no effects or inconclusive results and 2% reported the opposite effect. This exploratory study indicates that the common single-path analyses in social and behavioural research should not be simply assumed to be robust to alternative analyses. Therefore, we recommend the development and use of practices to explore and communicate this neglected source of uncertainty."
  authors:
    - {name: "Balázs Aczél", url: "https://metasciencelab.elte.hu/members/balazs-aczel/"}
    - {name: "Barnabas Szászi", url: "https://www.barnabasszaszi.com/"}
    - {name: "Livia Kósa"}
    - {name: "Zoltán Torma"}
