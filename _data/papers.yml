- section: working_papers
  title: "Do people use luxury cars to signal pecuniary strength? A test of conspicuous-consumption theory using a public disclosure reform"
  year: 2017
  abstract: "This paper evaluates whether signaling income or wealth is an important motive for owning expensive cars, which is a key premise in models of conspicuous consumption. Analyzing the introduction of online publication of tax records containing income and wealth in Norway in 2001, I find no effect on conspicuous consumption as measured by expensive cars. The findings suggest a re-interpretation of standard models of conspicuous consumption."
