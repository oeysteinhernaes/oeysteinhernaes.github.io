- section: international_publications
  title: "Young adults and the (non)-formation of voting habits – Evidence from Norwegian First‐time Eligible Citizens"
  year: 2019
  abstract: "This article exploits variation in age among first-time eligible citizens in Norwegian elections that arises through voting eligibility rules and two-year election cycles to investigate voting habits. I find that obtaining the right to vote at a lower age is associated with substantially higher turnout among first-time eligible citizens, however, this difference in political participation does not persist for subsequent elections. Building on the established literature on the habitual nature of voting, the results show that getting young citizens to vote once is not sufficient to create a habit of voting, and suggest that how the voting decision is made matter for the habit formation process."
  venue: "Scandinavian Political Studies, Volume 42, Issue 2"
  venue_url: "https://onlinelibrary.wiley.com/doi/10.1111/1467-9477.12139"

- section: international_publications
  title: "Television, Cognitive Ability, and High School Completion"
  year: 2019
  abstract: "We exploit supply-driven heterogeneity in the expansion of cable television across Norwegian municipalities to identify developmental effects of commercial television exposure during childhood. We find that higher exposure to commercial television reduces cognitive ability and high school graduation rates for boys. The effects appear to be driven by consumption of light television entertainment crowding out more cognitively stimulating activities. Point estimates suggest that the effects are most negative for boys from more educated families. We find no effect on high school completion for girls, pointing to the growth of noneducational media as a factor in the widening educational gender gap."
  authors:
