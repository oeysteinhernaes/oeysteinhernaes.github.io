- section: international_publications
  title: "Activation against Absenteeism: Evidence from a Sickness Insurance Reform in Norway"
  year: 2018
  abstract: "I evaluate a program aimed at strictly enforcing a requirement that people on long-term sick leave be partly back at work unless explicitly defined as an exception. Employing the synthetic control method, I find that the reform reduced work-hours lost due to sickness absenteeism by 12% in the reform region compared to a comparison unit created by a weighted average of similar regions. The effect is driven by both increased part-time presence of temporary disabled workers and accelerated recovery. Musculoskeletal disorders was the diagnosis group declining the most. The findings imply large savings in social security expenditures."
  venue: "Journal of Health Economics, Volume 62, November 2018, Pages 60-68"
  venue_url: "https://www.sciencedirect.com/science/article/pii/S0167629617311700"
  links:
