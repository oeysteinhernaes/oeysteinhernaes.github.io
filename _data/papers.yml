- section: international_publications
  title: "When health trumps money: Economic incentives and health equity in the public provision of nursing homes in Norway"
  year: 2023
  abstract: "The allocation of public care services should be determined by individual needs, but can be influenced by economic factors. This paper examines the impact of economic incentives on the allocation of public nursing home care in the Norwegian long-term care system. In Norway, municipalities and city districts have economic incentives for choosing nursing home care for high-income individuals in need of care and home-based care in sheltered housing for low-income individuals. The study uses a theoretical model and empirical data from the municipality of Oslo to determine if nursing home spots are allocated based on income, which would be financially advantageous for the city districts. We do not find evidence that the economic incentives of the care provider play a role in the allocation of nursing homes. Thus, in this setting, needs seem to be the dominant factor for allocation of nursing home care, while economic incentives seem to play no significant role. The clear legal mandate to provide services based on needs only is likely an important factor in this."
  authors:
    - {name: "Snorre Kverndokk", url: "https://scholar.google.com/citations?user=fPzDLGYAAAAJ&hl=en"}
    - {name: "Simen Markussen", url: "https://frischsenteret.no/english/people-details/?person_id=simenm"}
    - {name: "Henning Øien", url: "https://www.fhi.no/en/ab/departments-and-centres/health-services-research/henning-oien/"}
  venue: "Social Science and Medicine, Volume 333, September 2023, 116116"
  venue_url: "https://doi.org/10.1016/j.socscimed.2023.116116"

- section: international_publications
  title: "Making Activation for Young Welfare Recipients Mandatory"
  year: 2023
  abstract: "Activation policies to promote self-sufficiency among recipients of welfare and other types of benefits are becoming more common in many welfare states. We evaluate a law change in Norway making welfare receipt conditional on participation in an activation program for all welfare recipients below the age of 30. Analysing the program's staggered implementation across municipalities with several modern event study estimators, we estimate that the law change had quite precise 0-effects on benefit receipt, work and education. We also do not find any effects on the probability of being out of work or of being in employment, education or labour market programs. Qualitative evidence suggests that the zero effect may be due to the law change only impacting the participation of recipients with low expected gain from activation."
  authors:
    - {name: "Espen S. Dahl", url: "https://www.oslomet.no/about/employee/espendah/"}
  venue: "LABOUR: Review of Labour Economics and Industrial Relations, Volume 37, Issue 1, March 2023, Pages 96-121"
  venue_url: "https://onlinelibrary.wiley.com/doi/10.1111/labr.12238"
  links:
    - {label: "IZA Discussion Paper 15170", url: "https://docs.iza.org/dp15170.pdf"}

- section: international_publications
  title: "Party Leaders and Voter Responses to Political Terrorism"
  year: 2021
  abstract: "In this article, we study the political implications of terrorism rooted in extremist political ideologies. Our data uniquely allow studying the potential role of party leader evaluations on political outcomes, including voter turnout and vote choice. To strengthen causal identification, we combine an event-study framework with the fact that Norwegians were affected personally to differing degrees by the 22 July 2011 terror attack because of variation in the victims' municipalities of residence. Our main findings suggest that extreme right-wing terrorism influences party vote intentions and evaluations of political leaders strongly in the short run, as well as party choice in actual elections in the longer run. We document shifts within Norway's left-right political blocs rather than shifts between those blocs frequently observed following religious/separatist violence."
  authors:
    - {name: "Benny Geys", url: "https://www.bi.edu/about-bi/employees/department-of-economics/benny-geys/"}
  venue: "Public Choice, 187, 481-499 (2021)"
  venue_url: "https://doi.org/10.1007/s11127-020-00789-3"
  open_access: true
