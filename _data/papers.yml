- section: norwegian_publications
  title: "Effektanalyse av redusert minstesats for mottakere av arbeidsavklaringspenger (AAP) under 25 år og avvikling av ung ufør-tillegget"
  year: 2023
  abstract: "Formålet med arbeidsavklaringspenger (AAP) er å gi inntekt til personer som har nedsatt arbeidsevne på grunn av sykdom eller skade, mens de får hjelp fra NAV. Fra 1.2.2020 ble minstesatsen for AAP for mottakere under 25 år redusert, og ung-ufør-tillegget for AAP-mottakere ble fjernet. Disse endringene var ment å gjøre minstenivået på AAP likere andre ordninger og redusere sykdomsfokuset. Hoveddelen av rapporten omhandler analyse av redusert minstesats for mottakere av arbeidsavklaringspenger (AAP) under 25 år. Vi fokuserer på denne endringen fordi den påvirket alle nye mottakere av AAP under 25 år som kvalifiserte for minstesatsen. Ung ufør-tillegget var det derimot bare en liten andel som fikk, og mange som fikk det, gjorde det først etter AAP-forløpet. I tillegg har vi ikke hatt tilgjengelig individdata om mottak av ung ufør-tillegget. Arbeidet med evalueringen av endringene ble delt i to faser. Formålet med dette var å sikre at analytiske valg ble gjort på bakgrunn av faglige vurderinger og uavhengig av resultater. Første fase av prosjektet utviklet analysestrategi og -modell på bakgrunn av data fra før regelendringene trådte i kraft. Fase 1 ble avsluttet ved at analytiske valg ble endelig avgjort og loggført. Deretter ble data fra etter endringen gjort tilgjengelig, og fase 2, som besto av estimering av reformeffekter, startet. Metodevalget i fase 1 ble foretatt ved å teste tre ulike statistiske strategier på data fra før regelendringen trådte i kraft. På bakgrunn av disse analysene ble det besluttet å bruke en statistisk modell som antar at tidsutviklingen i innstrømmingen til AAP blant personer under 25 år med lav tidligere inntekt i utgangspunktet hadde en alders-spesifikk trend og en inntekts-spesifikk trend. Disse to trendene kan vi anslå fra grupper som ikke ble påvirket av regelendringene. Den aldersspesifikke trenden ble anslått med data for personer med inntekt over 3G, mens den inntektsspesifikke trenden ble anslått med data for personer som var eldre enn 25 år. Analysene på pre-reform-data indikerte at den endelige analysen ville ha svak presisjon, og dette viste seg å være tilfellet. De kvalitative intervjuene ga videre et klart inntrykk av at saksbehandlere så det som lite sannsynlig at regelendringene hadde fått store konsekvenser for innstrømmingen til AAP. Vi fokuserer derfor på resultatene fra en modellvariant som legger til grunn at AAP-sannsynligheten neppe ville bli mer enn halvert eller mer enn doblet som følge av regelendringene. Dette innbefatter likevel betydelige potensielle effekter. Det skal også nevnes at det at reformtidspunktet sammenfalt med koronaepidemien og samfunnets respons på denne i 2020 bidrar til ytterligere usikkerhet. Resultatene fra vår foretrukne modellspesifikasjon tilsier at regelendringene reduserte antallet nye AAP-tilfeller blant unge med lav inntekt med 208 tilfeller i 2020 og 170 tilfeller i 2021. Ettersom det er rundt 3500 nye AAP-tilfeller årlig fra denne gruppen som helhet, tilsier disse «punktestimatene» en nedgang på rundt 5-6 prosent. Estimatene er imidlertid innenfor den variasjonen fra år til år som forekom i perioden før regelendringene. Vi kan derfor ikke utelukke at de skyldes tilfeldig variasjon som ikke hadde med regelendringene å gjøre. I tråd med analyseplanen som ble utarbeidet i prosjektets første fase, ble den statistiske modellen også benyttet på andre utfall. Her var tanken at de som eventuelt ikke begynte å motta AAP fordi minstesatsen ble redusert, i stedet kunne dukke opp som sosialhjelpsmottagere, i utdanningssystemet eller på kvalifiseringsprogrammet. Her var det kun i analysen av kvalifiseringsprogrammet at analysetilnærmingen viste seg egnet. Vi finner ingen tegn til at regelendringene påvirket overgang til kvalifiseringsprogrammet. Til slutt analyserer vi resultater for faktiske mottakere av arbeidsavklaringspenger. Ettersom vi i de tidligere analysene fant tegn til at innstrømmingen til AAP ble redusert, må vi være varsomme med tolkningen av resultatene for faktiske mottakere, ettersom sammensetningen av denne gruppa kan ha blitt endret. Når vi sammenligner nye mottagere fra før og etter reformen på utfall som tidligere karakterer ved avslutning av grunnskolen og andelen som har fullført videregående skole ser vi imidlertid ingen tegn til slik komposisjonsendring av gruppen. Analysene av de faktiske mottakerne finner at andelen AAP-mottakere under 25 år med supplerende sosialhjelp har økt tydelig fra og med 2020. Det er naturlig å se dette i sammenhengen med reduksjonen i minstesatsen. Funnet er også konsistent med de bekymringene vi møtte da vi intervjuet veiledere fra tre forskjellige NAV-kontor. De var bekymret for at regelendringene ville føre til en kraftig økning i supplerende sosialhjelp for de yngste mottakerne. Imidlertid må det understrekes at det fortsatt er få AAP-mottakere som mottar supplerende sosialhjelp også etter regelendringene. Blant nye mottakere av AAP under 25 år i 2020 og 2021 var det i en gjennomsnittlig måned 11 prosent som mottok sosialhjelp, mot 7 prosent hos nye mottakere i alderen 25-28 år. Når det gjelder avgang fra AAP og tilgang til uføretrygd, arbeid eller utdanning, finner vi ingen klare endringer fra og med 2020. Avgangsmønsteret fra AAP er tilnærmet likt for yngre og eldre nye mottakere over tid. Mottakere av AAP i alderen 18-23 ser ut til å bli noe raskere avklart til uføretrygd enn mottakere i alderen 25-28. Dette var tilfellet også før regelendringene, men det er en svak antydning til at dette kan ha økt noe for nye AAP-mottakere i alderen 18-23 år fra 2020. Imidlertid er forskjellene små og usikkerheten stor."
  authors:
    - {name: "Ole Røgeberg", url: "https://frischsenteret.no/english/people-details/?person_id=olejr"}
    - {name: "Helene Berg"}
    - {name: "Gro Malene Vestøl"}
