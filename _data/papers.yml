- section: norwegian_publications
  title: "Sykepengemottak blant eldre arbeidstakere i Norge 1993-2019"
  year: 2025
  abstract: "I denne artikkelen beskriver vi utviklingen i mottak av sykepenger blant sysselsatte i aldersgruppene 45–49 år, 50–54 år, 55–59 år og 60–66 år i Norge 1993–2019. Generelt økte sykepengemottaket markant fram til tidlig 2000-tall, for deretter å falle fram til 2019. Nedgangen har vært størst for eldre aldersgrupper og særlig stor blant 60–66-åringene, som samtidig har hatt en markant økning i sysselsetting. Det har også vært en stor nedgang i mottak av arbeidsavklaringspenger (AAP) og uføretrygd blant 60–66-åringer i samme periode, så den store nedgangen i sykepengemottaket per sysselsatt blant de eldste forklares ikke av at flere av de sykeste i denne gruppen mottar andre helserelaterte ytelser i stedet. Selv om endrede regler for tidlig uttak av pensjon har hatt stor betydning for yrkesaktiviteten til dem i 60-årene i perioden, ser dette ikke ut til å ha påvirket sykepengemottaket blant yrkesaktive i særlig grad. Økt utdanningsnivå, endret yrkessammensetning og bedret helse målt ved forventet gjenstående levetid kan forklare noe av nedgangen i sykepengemottaket, men selv når vi justerer for alle disse faktorene, gjenstår en betydelig nedgang i sykepengemottaket fra 2003 til 2019, særlig blant eldre aldersgrupper."
  authors:
